<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoClash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <h1>CryptoClash</h1>
    <div id="balance">Coins: <span id="coins">0</span></div>
    <button id="click-button">Mine Coins</button>
    <div id="upgrades">
      <h2>Upgrades</h2>
      <button id="upgrade-click">Upgrade Click (+1) - 50 Coins</button>
      <button id="upgrade-auto">Auto Miner (+1/sec) - 100 Coins</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
